[package]
name = "pumplite"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "pumplite"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.0"
anchor-spl = { version = "=1.0.0", default-features = false, features = ["token", "associated_token"] }
