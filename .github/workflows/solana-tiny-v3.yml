name: PumpLite tiny sBPFv3 benchmark

on:
  push:
    branches:
      - solana-tiny-v3-core
    paths:
      - "experiments/pumplite-tiny-v3/**"
      - ".github/workflows/solana-tiny-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Agave 4.3.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/agave"
          cd "$RUNNER_TEMP/agave"

          curl --fail --location --retry 3 \
            -o agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2

          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  agave.tar.bz2" \
            | sha256sum --check --strict

          tar -xjf agave.tar.bz2

          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          solana --version
          cargo-build-sbf --version
          rustc --version

      - name: Generate isolated lockfile
        shell: bash
        run: |
          cargo generate-lockfile \
            --manifest-path experiments/pumplite-tiny-v3/Cargo.toml

      - name: Test bonding curve
        shell: bash
        run: |
          cargo test \
            --manifest-path experiments/pumplite-tiny-v3/Cargo.toml \
            --lib

      - name: Build real PumpLite trade core for sBPFv3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p target/tiny-v3-deploy

          cargo-build-sbf \
            --manifest-path experiments/pumplite-tiny-v3/Cargo.toml \
            --arch v3 \
            --optimize-size \
            --sbf-out-dir target/tiny-v3-deploy

      - name: Benchmark binary
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail

          so="$(find target/tiny-v3-deploy -maxdepth 1 -type f -name '*.so' -print -quit)"

          if [ -z "$so" ]; then
            echo "No .so artifact found"
            exit 1
          fi

          size="$(stat -c%s "$so")"
          hash="$(sha256sum "$so" | awk '{print $1}')"

          baseline=239976

          # At the planned final rent rate:
          # (program bytes + 128) * 696 lamports
          #
          # 14,239 bytes => 9,999,432 lamports
          # 14,240 bytes => 10,000,128 lamports
          target=14239

          saved=$((baseline - size))
          bond_lamports=$(((size + 128) * 696))

          bond_sol="$(awk \
            -v l="$bond_lamports" \
            'BEGIN { printf "%.9f", l / 1000000000 }')"

          echo ""
          echo "========================================="
          echo "PUMPLITE REAL TRADE CORE"
          echo "========================================="
          echo "Binary: $so"
          echo "Size: $size bytes"
          echo "Previous Anchor build: $baseline bytes"
          echo "Bytes removed: $saved"
          echo "0.01 SOL byte ceiling: $target bytes"
          echo "Projected final-rate storage bond: $bond_sol SOL"
          echo "SHA-256: $hash"
          echo "========================================="

          {
            echo "## PumpLite real sBPFv3 trade core"
            echo ""
            echo "- Binary size: **${size} bytes**"
            echo "- Previous Anchor build: **${baseline} bytes**"
            echo "- Bytes removed: **${saved} bytes**"
            echo "- Maximum for <0.01 SOL at 696 lamports/byte: **${target} bytes**"
            echo "- Projected final-rate storage bond: **${bond_sol} SOL**"
            echo "- SHA-256: \`${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "so=$so" >> "$GITHUB_OUTPUT"
          echo "bond_sol=$bond_sol" >> "$GITHUB_OUTPUT"

          if [ "$size" -le "$target" ]; then
            echo "PASS - UNDER 0.01 SOL SIZE CEILING"
          else
            echo "FAIL - ABOVE 0.01 SOL SIZE CEILING"
          fi

      - name: Upload benchmark binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pumplite-real-trade-core-v3
          retention-days: 30
          if-no-files-found: error
          path: |
            target/tiny-v3-deploy/*.so

      - name: Enforce 0.01 SOL byte ceiling
        shell: bash
        run: |
          size="${{ steps.benchmark.outputs.size }}"

          if [ "$size" -gt 14239 ]; then
            echo "FAIL - ${size} bytes exceeds 14,239-byte ceiling"
            exit 1
          fi

          echo "PASS - ${size} bytes stays below 0.01 SOL storage ceiling"

# Benchmark/test only.
# No RPC.
# No wallet.
# No Mainnet transaction.
# No deployment.