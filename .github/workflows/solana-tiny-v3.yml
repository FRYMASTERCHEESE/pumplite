name: PumpLite tiny sBPFv3 benchmark

on:
  push:
    branches:
      - solana-tiny-v3-core
    paths:
      - "experiments/pumplite-tiny-v3/**"
      - ".github/workflows/solana-tiny-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Agave 4.3.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/agave"
          cd "$RUNNER_TEMP/agave"

          curl --fail --location --retry 3 \
            -o agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2

          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  agave.tar.bz2" \
            | sha256sum --check --strict

          tar -xjf agave.tar.bz2

          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          solana --version
          cargo-build-sbf --version
          rustc --version

      - name: Generate isolated lockfile
        shell: bash
        run: |
          cargo generate-lockfile \
            --manifest-path experiments/pumplite-tiny-v3/Cargo.toml

      - name: Build tiny PumpLite core for sBPFv3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p target/tiny-v3-deploy

          cargo-build-sbf \
            --manifest-path experiments/pumplite-tiny-v3/Cargo.toml \
            --arch v3 \
            --optimize-size \
            --sbf-out-dir target/tiny-v3-deploy

      - name: Benchmark binary
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail

          so="$(find target/tiny-v3-deploy -maxdepth 1 -type f -name '*.so' -print -quit)"

          if [ -z "$so" ]; then
            echo "No .so artifact found"
            exit 1
          fi

          size="$(stat -c%s "$so")"
          hash="$(sha256sum "$so" | awk '{print $1}')"

          baseline=239976
          target=14000

          saved=$((baseline - size))

          printf 'Binary: %s\n' "$so"
          printf 'Size: %s bytes\n' "$size"
          printf 'Previous optimized Anchor build: %s bytes\n' "$baseline"
          printf 'Bytes removed: %s\n' "$saved"
          printf 'Hard target: <= %s bytes\n' "$target"
          printf 'SHA-256: %s\n' "$hash"

          {
            echo "## PumpLite tiny sBPFv3 benchmark"
            echo ""
            echo "- Binary size: **${size} bytes**"
            echo "- Previous optimized Anchor build: **${baseline} bytes**"
            echo "- Bytes removed: **${saved} bytes**"
            echo "- 0.01-SOL-class target: **<= ${target} bytes**"
            echo "- SHA-256: \`${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "so=$so" >> "$GITHUB_OUTPUT"

          if [ "$size" -le "$target" ]; then
            echo "PASS - CORE IS WITHIN 14 KB TARGET"
          else
            echo "CORE ABOVE 14 KB - continue slimming"
          fi

      - name: Upload benchmark binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pumplite-tiny-v3-benchmark
          retention-days: 30
          if-no-files-found: error
          path: |
            target/tiny-v3-deploy/*.so

# Benchmark only.
# No RPC.
# No wallet.
# No signing key.
# No Mainnet transaction.
# No deployment.
