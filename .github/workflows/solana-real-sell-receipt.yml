name: Real Solana wallet sell receipt audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify-solana-real-sell.mjs"
      - "tests/solana-real-sell-proof.test.mjs"
      - ".github/workflows/solana-real-sell-receipt.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/verify-solana-real-sell.mjs"
      - "tests/solana-real-sell-proof.test.mjs"
      - ".github/workflows/solana-real-sell-receipt.yml"
permissions:
  contents: read
jobs:
  verify-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify fail-closed synthetic receipt tests
        run: node --test tests/solana-real-sell-proof.test.mjs
      - name: Verify actual finalized PumpLite MAYM SELL against read-only Mainnet RPC
        run: node scripts/verify-solana-real-sell.mjs
# This workflow never signs, simulates, broadcasts, writes chain state, or spends SOL.
