name: Real Base wallet trade receipt audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify-base-real-wallet-trades.mjs"
      - "tests/base-real-wallet-trade-receipts.test.mjs"
      - ".github/workflows/base-live-wallet-receipts.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/verify-base-real-wallet-trades.mjs"
      - ".github/workflows/base-live-wallet-receipts.yml"

permissions:
  contents: read

jobs:
  audit-wallet-trade-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate historical real wallet BUY receipts read-only
        run: node scripts/verify-base-real-wallet-trades.mjs
