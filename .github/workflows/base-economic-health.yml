name: Base economic health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "contracts/base/v2/**"
      - "scripts/compile-base-v2.mjs"
      - "scripts/verify-base-economic-health.mjs"
      - "web/generated/base-v2-abi.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/base-economic-health.yml"

permissions:
  contents: read

concurrency:
  group: base-economic-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-base-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Independently verify live Base V2 quote economics
        env:
          PUMPLITE_MAX_MARKETS: "250"
        run: pnpm verify:base-economic-health
