name: PumpLite Solana integration verification

on:
  push:
    paths:
      - "config.json"
      - "web/adapters/solana-tiny.js"
      - "web/solana-tiny-instructions.js"
      - "workers/pumplite-rpc/**"
      - "workers/pumplite-upload-guard/**"
      - "tests/solana-*.test.mjs"
      - "scripts/verify-pump-mainnet.mjs"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "config.json"
      - "web/adapters/solana-tiny.js"
      - "web/solana-tiny-instructions.js"
      - "workers/pumplite-rpc/**"
      - "workers/pumplite-upload-guard/**"
      - "tests/solana-*.test.mjs"
      - "scripts/verify-pump-mainnet.mjs"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pumplite-solana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify reviewed PumpLite Mainnet configuration
        run: node scripts/verify-pump-mainnet.mjs

      - name: Run PumpLite Solana safety tests
        run: >
          node --test
          tests/solana-pump-mainnet.test.mjs
          tests/solana-zero-cost-create.test.mjs
          tests/solana-tiny-instructions.test.mjs
          tests/solana-tiny-write-rpc.test.mjs
          tests/solana-tiny-phantom.test.mjs
          tests/solana-free-launch-registry.test.mjs
          tests/solana-first-buyer-local.test.mjs
          tests/solana-first-buyer-reservation.test.mjs
          tests/solana-first-buyer-activation.test.mjs

      - name: Repository safety check
        run: pnpm check

      - name: Verify no deployment keys exist
        shell: bash
        run: |
          test ! -e target/deploy/pumplite-keypair.json
          test ! -e pumplite-program-keypair.json
          echo "No deployment signing files present."
