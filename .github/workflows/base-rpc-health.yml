name: Base RPC redundancy

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "deployments/base-v2-mainnet.json"
      - "scripts/verify-base-rpc-health.mjs"
      - "web/plite-info.json"
      - "web/base-rpc.js"
      - "web/generated/base-v2-abi.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/base-rpc-health.yml"

permissions:
  contents: read

concurrency:
  group: base-rpc-redundancy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rpc-redundancy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify every configured Base RPC endpoint
        env:
          PUMPLITE_RPC_MAX_BLOCK_LAG: "300"
          PUMPLITE_RPC_MAX_STALE_SECONDS: "900"
        run: pnpm verify:base-rpc-health
