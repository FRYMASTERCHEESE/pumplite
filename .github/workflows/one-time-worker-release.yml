name: One-time PumpLite worker release

on:
  push:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Release aligned PumpLite workers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy upload guard first
        working-directory: workers/pumplite-upload-guard
        run: npx --yes wrangler@4.56.0 deploy
      - name: Deploy public RPC worker
        working-directory: workers/pumplite-rpc
        run: npx --yes wrangler@4.56.0 deploy
      - name: Verify live health
        shell: bash
        run: |
          curl --fail-with-body -sS https://pumplite-rpc.coreyedge123.workers.dev/health
