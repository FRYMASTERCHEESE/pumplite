name: MAYM repair - regenerate Pages assets
on:
  push:
    branches:
      - fix/maym-retry-buy-lock-20261010
permissions:
  contents: write
jobs:
  rebuild-pages:
    if: "!contains(github.event.head_commit.message, 'Rebuild MAYM Pages assets')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate and verify Pages assets
        run: |
          pnpm build:pages
          pnpm check:pages
      - name: Push regenerated Pages assets to repair branch
        run: |
          git add -A -- assets
          if git diff --cached --quiet; then
            echo "No assets changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild MAYM Pages assets"
          git push origin HEAD:fix/maym-retry-buy-lock-20261010
