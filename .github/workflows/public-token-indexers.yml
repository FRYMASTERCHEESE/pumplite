name: Public token verification - no keys

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-token-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-token-indexers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Static no-key verification policy tests
        run: node --test tests/public-token-indexers-verifier.test.mjs

      - name: Check public PLITE verification and discovery
        run: node scripts/verify-public-token-indexers.mjs