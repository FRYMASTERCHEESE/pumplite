name: Metadata infrastructure health

on:
  workflow_dispatch:
  schedule:
    - cron: "53 20 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "web/metadata-auth-client.js"
      - "web/metadata-upload.js"
      - "web/metadata-fields.js"
      - "workers/pumplite-rpc/**"
      - "workers/pumplite-upload-guard/**"
      - "workers/pumplite-base-signature-rpc/**"
      - "scripts/verify-metadata-health.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/metadata-health.yml"

permissions:
  contents: read

concurrency:
  group: metadata-infrastructure-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-metadata-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify live metadata authorization and upload gates
        env:
          PUMPLITE_METADATA_TIMEOUT_MS: "15000"
        run: pnpm verify:metadata-health
