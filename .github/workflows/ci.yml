name: Local verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rebuild-maym-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/maym-retry-buy-lock-20261010' && !contains(github.event.head_commit.message, 'Rebuild MAYM Pages assets')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild checked-in Pages assets
        run: |
          pnpm build:pages
          pnpm check:pages
      - name: Commit only deterministic generated assets
        run: |
          git add -A -- assets
          if git diff --cached --quiet; then
            echo "Pages assets already match source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild MAYM Pages assets"
          git push origin HEAD:fix/maym-retry-buy-lock-20261010
  web-and-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject unreviewed dependency advisories
        run: |
          mkdir -p build
          # Audit may return nonzero for explicitly reviewed findings; parser fails closed on unreviewed or critical findings.
          pnpm audit --json > build/dependency-audit.json || true
          node scripts/check-dependency-review.mjs
      - run: pnpm check:pages
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
      - name: Browser checks against local files only
        run: |
          node scripts/serve.mjs > /tmp/pumplite-preview.log 2>&1 &
          pnpm test:browser
      - name: Identify canonical Base candidate
        run: node scripts/release-manifest.mjs --canonical
      - name: Package and verify offline Base release
        run: node scripts/release-package.mjs pack base
      - name: Retain source verification input and Base artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-verification
          retention-days: 30
          if-no-files-found: error
          path: |
            build/release-packages/base/
  # Linux freshness is checked above; also protect Windows-generated Pages assets.
  pages-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:pages
# Solana host, SBF and VM verification lives in solana.yml.
