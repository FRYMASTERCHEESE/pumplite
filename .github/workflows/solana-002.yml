name: PumpLite 0.04 SOL candidate

on:
  push:
    branches: [solana-002-cost]
    paths:
      - "experiments/pumplite-tiny-v3/**"
      - "tests/solana-002-integration.mjs"
      - ".github/workflows/solana-002.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Agave 4.3.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agave"
          cd "$RUNNER_TEMP/agave"
          curl --fail --location --retry 3 -o agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  agave.tar.bz2" \
            | sha256sum --check --strict
          tar -xjf agave.tar.bz2
          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"

      - name: Rust unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path experiments/pumplite-tiny-v3/Cargo.toml --lib
          cargo test --manifest-path experiments/pumplite-tiny-v3/Cargo.toml --lib --features bitmul

      - name: Build safe size variants
        id: build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target/solana-002
          mkdir -p target/solana-002/variants

          best_size=999999999
          best_name=""
          best_path=""

          build_variant() {
            name="$1"
            features="$2"
            out="target/solana-002/variants/$name"

            mkdir -p "$out"

            echo ""
            echo "=== BUILD $name ==="
            echo "features: $features"

            cargo-build-sbf \
              --manifest-path experiments/pumplite-tiny-v3/Cargo.toml \
              --arch v3 \
              --optimize-size \
              --features "$features" \
              --sbf-out-dir "$out"

            so="$out/pumplite_tiny_v3.so"
            size=$(stat -c%s "$so")

            echo "$name bytes: $size"

            if [ "$size" -lt "$best_size" ]; then
              best_size="$size"
              best_name="$name"
              best_path="$so"
            fi
          }

          build_variant base "bitmul"
          build_variant remaining "bitmul,auto-remaining"
          build_variant quote "bitmul,auto-quote"
          build_variant process "bitmul,auto-process"
          build_variant rem_quote "bitmul,auto-remaining,auto-quote"
          build_variant rem_process "bitmul,auto-remaining,auto-process"
          build_variant quote_process "bitmul,auto-quote,auto-process"
          build_variant rem_quote_process "bitmul,auto-remaining,auto-quote,auto-process"
          build_variant md "bitmul,auto-md"
          build_variant sol "bitmul,auto-sol"
          build_variant token "bitmul,auto-token"
          build_variant xfers "bitmul,auto-sol,auto-token"
          build_variant cpi "bitmul,auto-cpi"
          build_variant cpi_remaining "bitmul,auto-cpi,auto-remaining"
          build_variant cpi_quote "bitmul,auto-cpi,auto-quote"
          build_variant all_auto "bitmul,auto-cpi,auto-md,auto-sol,auto-token,auto-remaining,auto-quote,auto-process"

          cp "$best_path" \
            target/solana-002/pumplite_tiny_v3.so

          hash=$(sha256sum \
            target/solana-002/pumplite_tiny_v3.so |
            awk '{print $1}')

          echo ""
          echo "============================================"
          echo "SMALLEST SAFE LAYOUT"
          echo "variant: $best_name"
          echo "bytes: $best_size"
          echo "sha256: $hash"
          echo "============================================"

          echo "size=$best_size" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "variant=$best_name" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false --ignore-scripts @solana/spl-token@0.4.13

      - name: Real local-validator integration
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          payer="$RUNNER_TEMP/payer.json"
          program="$RUNNER_TEMP/program.json"
          ledger="$RUNNER_TEMP/ledger"

          solana-keygen new --no-bip39-passphrase --silent --force -o "$payer"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$program"

          solana-test-validator --reset --quiet --ledger "$ledger" \
            >"$RUNNER_TEMP/validator.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 60); do
            if solana --url http://127.0.0.1:8899 cluster-version >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" = 1 ] || { cat "$RUNNER_TEMP/validator.log"; exit 1; }

          solana --url http://127.0.0.1:8899 --keypair "$payer" airdrop 10 >/dev/null

          solana --url http://127.0.0.1:8899 --keypair "$payer" \
            program deploy target/solana-002/pumplite_tiny_v3.so \
            --program-id "$program"

          program_id=$(solana-keygen pubkey "$program")

          PROGRAM_ID="$program_id" \
          PAYER_KEYPAIR="$payer" \
            node tests/solana-002-integration.mjs

      - name: Save measured candidate to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/solana-002
          cp target/solana-002/pumplite_tiny_v3.so ci/solana-002/pumplite_tiny_v3.so

          size='${{ steps.build.outputs.size }}'
          hash='${{ steps.build.outputs.hash }}'
          variant='${{ steps.build.outputs.variant }}'
          source_sha='${{ github.sha }}'

          verified=false
          if [ '${{ steps.integration.outcome }}' = 'success' ]; then verified=true; fi

          printf '{"verified":%s,"size":%s,"sha256":"%s","variant":"%s","source_sha":"%s"}\n' \
            "$verified" "$size" "$hash" "$variant" "$source_sha" \
            > ci/solana-002/result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/solana-002
          git commit -m "Record verified 0.04 SOL candidate"
          git push origin HEAD:solana-002-cost

      - name: Enforce hard size ceiling
        shell: bash
        run: |
          set -euo pipefail
          size='${{ steps.build.outputs.size }}'
          if [ '${{ steps.integration.outcome }}' != 'success' ]; then
            echo "FAIL: local-validator integration failed"
            exit 1
          fi
          if [ "$size" -gt 7650 ]; then
            echo "FAIL: $size bytes > 7650-byte verification ceiling"
            exit 1
          fi
          echo "PASS: integration passed and $size bytes <= 7650"
