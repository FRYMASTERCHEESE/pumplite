name: Base V3 Classic and Mayhem candidate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-v3-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reproducibly compile V3 candidate
        run: node scripts/compile-base-v3.mjs

      - name: Verify committed V3 ABI is reproducible
        run: git diff --exit-code -- web/generated/base-v3-abi.json

      - name: Run V3 candidate contract and safety tests
        run: node --test tests/base-v3-candidate.mjs tests/base-v3-static-candidate.mjs

      - name: Run complete existing PumpLite regression suite
        run: pnpm test

      - name: Run repository safety checks
        run: pnpm check

      - name: Verify existing token-verification checkpoint remains green
        run: pnpm verify:token-verification-1001-5000