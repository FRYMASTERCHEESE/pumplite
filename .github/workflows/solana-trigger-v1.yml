name: PumpLite Solana Mayhem Trigger V1

on:
  push:
    branches:
      - solana-mayhem-trigger-v1
    paths:
      - "experiments/pumplite-trigger-v1/**"
      - "docs/SOLANA_TRIGGER_V1.md"
      - ".github/workflows/solana-trigger-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sbpf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Agave 4.3.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/agave"
          cd "$RUNNER_TEMP/agave"

          curl --fail --location --retry 3 \
            -o agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2

          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  agave.tar.bz2" \
            | sha256sum --check --strict

          tar -xjf agave.tar.bz2

          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          set -euo pipefail
          solana --version
          cargo-build-sbf --version
          rustc --version

      - name: Generate isolated lockfile
        shell: bash
        run: |
          set -euo pipefail

          cargo generate-lockfile \
            --manifest-path experiments/pumplite-trigger-v1/Cargo.toml

      - name: Targeted Trigger unit tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test \
            --manifest-path experiments/pumplite-trigger-v1/Cargo.toml \
            --lib

      - name: Build REAL Solana sBPF Trigger program
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p target/trigger-v1

          cargo-build-sbf \
            --manifest-path experiments/pumplite-trigger-v1/Cargo.toml \
            --arch v3 \
            --optimize-size \
            --sbf-out-dir target/trigger-v1

      - name: Record binary size and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          so="$(
            find target/trigger-v1 \
              -maxdepth 1 \
              -type f \
              -name '*.so' \
              -print \
              -quit
          )"

          if [ -z "$so" ]; then
            echo "STOP - real .so binary not found"
            exit 1
          fi

          size="$(stat -c%s "$so")"
          hash="$(sha256sum "$so" | awk '{print $1}')"

          echo ""
          echo "============================================"
          echo " REAL PUMPLITE SOLANA MAYHEM TRIGGER V1"
          echo "============================================"
          echo "Binary: $so"
          echo "Size: $size bytes"
          echo "SHA-256: $hash"
          echo "Simulation: NO - this is compiled sBPF program code"
          echo "Deployment: NOT performed"
          echo "============================================"

          {
            echo "## Real PumpLite Solana Trigger V1"
            echo ""
            echo "- sBPF binary: \`$(basename "$so")\`"
            echo "- Binary size: **${size} bytes**"
            echo "- SHA-256: \`${hash}\`"
            echo "- Mainnet deployment: **not performed**"
            echo "- No wallet/private key used by CI"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real sBPF program artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pumplite-solana-mayhem-trigger-v1-sbpf
          retention-days: 30
          if-no-files-found: error
          path: |
            target/trigger-v1/*.so

# This workflow compiles the real deployable Solana program.
# It deliberately does not deploy or spend SOL.
