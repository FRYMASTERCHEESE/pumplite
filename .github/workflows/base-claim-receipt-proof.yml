name: Live Base holder-claim receipt verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/base-claim-receipt-discovery.mjs"
      - "scripts/verify-hardening-19-27.mjs"
      - "tests/base-claim-receipt-discovery.test.mjs"
      - ".github/workflows/base-claim-receipt-proof.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/base-claim-receipt-discovery.mjs"
      - "scripts/verify-hardening-19-27.mjs"
      - ".github/workflows/base-claim-receipt-proof.yml"

permissions:
  contents: read

concurrency:
  group: base-claim-receipt-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-historical-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify live claim count, receipts, transfers and funding on Base
        env:
          PUMPLITE_HARDENING_LIVE: "1"
          PUMPLITE_HARDENING_LOG_BLOCK_SPAN: "50000"
          PUMPLITE_HARDENING_ARCHIVE_RPC_URL: ${{ secrets.PUMPLITE_HARDENING_ARCHIVE_RPC_URL }}
        run: pnpm verify:hardening-19-27
