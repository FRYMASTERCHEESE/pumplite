name: PumpLite 0.01 SOL raw candidate

on:
  push:
    branches: [solana-001-cost]
    paths:
      - "experiments/pumplite-raw-v1/**"
      - "tests/solana-002-integration.mjs"
      - ".github/workflows/solana-001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Agave 4.3.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/agave"
          cd "$RUNNER_TEMP/agave"

          curl --fail --location --retry 3 \
            -o agave.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2

          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  agave.tar.bz2" \
            | sha256sum --check --strict

          tar -xjf agave.tar.bz2

          echo "$RUNNER_TEMP/agave/solana-release/bin" \
            >> "$GITHUB_PATH"

      - name: Build raw SBPFv3 core
        id: build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target/solana-001
          mkdir -p target/solana-001

          cargo-build-sbf \
            --manifest-path experiments/pumplite-raw-v1/Cargo.toml \
            --arch v3 \
            --optimize-size \
            --sbf-out-dir target/solana-001

          so=target/solana-001/pumplite_raw_v1.so

          size=$(stat -c%s "$so")
          hash=$(sha256sum "$so" | awk '{print $1}')

          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "RAW CORE SIZE: $size bytes"
          echo "SHA256: $hash"
          echo "0.01 SOL CODE TARGET: <= 1800 bytes"
          echo "======================================"

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile

          pnpm add \
            --save-dev \
            --lockfile=false \
            --ignore-scripts \
            @solana/spl-token@0.4.13

      - name: Real local-validator BUY SELL security test
        id: integration
        shell: bash
        run: |
          set -euo pipefail

          payer="$RUNNER_TEMP/payer.json"
          program="$RUNNER_TEMP/program.json"
          ledger="$RUNNER_TEMP/ledger"

          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            -o "$payer"

          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            -o "$program"

          solana-test-validator \
            --reset \
            --quiet \
            --ledger "$ledger" \
            >"$RUNNER_TEMP/validator.log" 2>&1 &

          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0

          for i in $(seq 1 60); do
            if solana \
              --url http://127.0.0.1:8899 \
              cluster-version >/dev/null 2>&1
            then
              ready=1
              break
            fi

            sleep 1
          done

          [ "$ready" = 1 ] || {
            cat "$RUNNER_TEMP/validator.log"
            exit 1
          }

          solana \
            --url http://127.0.0.1:8899 \
            --keypair "$payer" \
            airdrop 10 \
            >/dev/null

          solana \
            --url http://127.0.0.1:8899 \
            --keypair "$payer" \
            program deploy \
            target/solana-001/pumplite_raw_v1.so \
            --program-id "$program"

          program_id=$(
            solana-keygen pubkey "$program"
          )

          PROGRAM_ID="$program_id" \
          PAYER_KEYPAIR="$payer" \
            node tests/solana-002-integration.mjs

      - name: Enforce 0.01 SOL size target
        shell: bash
        run: |
          set -euo pipefail

          size='${{ steps.build.outputs.size }}'

          if [ "$size" -gt 1800 ]; then
            echo "NOT YET: $size bytes > 1800-byte 0.01 SOL target"
            exit 1
          fi

          echo "PASS: $size bytes <= 1800"
          echo "0.01 SOL SIZE TARGET REACHED"