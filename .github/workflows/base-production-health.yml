name: Base production health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"
  push:
    paths:
      - "config.json"
      - "deployments/base-v2-mainnet.json"
      - "contracts/base/v2/**"
      - "contracts/base/claim/**"
      - "scripts/compile-base-v2.mjs"
      - "scripts/compile-plite-holder-claim.mjs"
      - "scripts/verify-base-production.mjs"
      - "web/plite-info.json"
      - "web/verified-tokens.json"
      - "web/generated/base-v2-abi.json"
      - "web/generated/plite-holder-claim.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/base-production-health.yml"

permissions:
  contents: read

concurrency:
  group: base-production-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile and verify live Base production
        run: pnpm verify:base-production
