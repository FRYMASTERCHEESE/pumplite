name: Public site health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "claim.html"
      - "verification.html"
      - "status.html"
      - "status.js"
      - "v3-deploy.html"
      - "terms.html"
      - "privacy.html"
      - "risk.html"
      - "manifest.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - "token-list.json"
      - ".well-known/**"
      - "config.json"
      - "assets/**"
      - "web/**"
      - "scripts/build.mjs"
      - "scripts/verify-public-site.mjs"
      - "package.json"
      - ".github/workflows/public-site-health.yml"

permissions:
  contents: read

concurrency:
  group: public-site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Wait for Pages and verify live public site
        env:
          PUMPLITE_SITE_VERIFY_ATTEMPTS: "24"
          PUMPLITE_SITE_VERIFY_DELAY_MS: "15000"
        run: node scripts/verify-public-site.mjs
