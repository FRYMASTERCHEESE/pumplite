name: Production hardening 19-27

on:
  workflow_dispatch:
  schedule:
    - cron: "47 21 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "deployments/base-v2-mainnet.json"
      - "contracts/base/**"
      - "web/plite-info.json"
      - "web/verified-tokens.json"
      - "web/wallets.js"
      - "web/mobile.js"
      - "web/adapters/base-v2.js"
      - "claim.html"
      - "terms.html"
      - "privacy.html"
      - "risk.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/verify-hardening-19-27.mjs"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: production-hardening-19-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify production hardening Steps 19-27
        env:
          PUMPLITE_HARDENING_LOG_BLOCK_SPAN: "10000"
          PUMPLITE_HARDENING_FETCH_ATTEMPTS: "4"
        run: pnpm verify:hardening-19-27
