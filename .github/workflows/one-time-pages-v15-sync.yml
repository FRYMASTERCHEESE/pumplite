name: One-time Pages V15 sync

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Sync PumpLite V15 Pages assets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate repository Pages assets
        run: pnpm build:pages
      - name: Commit generated assets only
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "Pages assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets
          git commit -m "Regenerate PumpLite V15 Pages assets [skip ci]"
          git push origin HEAD:main
