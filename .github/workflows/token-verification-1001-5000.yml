name: Token verification 1001-5000

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: token-verification-1001-5000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-plite-token-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify 4,000 PLITE token evidence gates
        run: pnpm verify:token-verification-1001-5000

      - name: Verify exact gate count and sequence
        run: node --test tests/token-verification-1001-5000.test.mjs

      - name: Verify published Pages assets are current
        run: pnpm check:pages