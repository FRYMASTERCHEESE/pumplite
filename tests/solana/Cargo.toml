[package]
name = "pumplite-svm-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
sbf-tests = []

[dependencies]
pumplite = { path = "../../programs/pumplite", features = ["no-entrypoint"] }
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "associated_token"] }
litesvm = "=0.9.1"
solana-address = "2.0"
solana-instruction = "~3.1"
solana-keypair = "~3.1"
solana-message = "~3.0"
solana-signer = "~3.0"
solana-transaction = "~3.0"

[[test]]
name = "markets"
path = "markets.rs"
required-features = ["sbf-tests"]
