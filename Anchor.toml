[toolchain]
anchor_version = "1.0.0"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

# Build identity only, not a verified deployment.
[programs.localnet]
pumplite = "7yCAWc9Tk8F5eTjn731ZZKxNypoBrbaXvFEm6c9z8ybY"

# Required by the Anchor CLI parser for IDL generation. No wallet exists at this path.
# Verification never reads it, starts a validator, or uses the provider's RPC.
[provider]
cluster = "Localnet"
wallet = "target/NO_WALLET_CONFIGURED"

# No Mainnet provider or deployment scripts.
