[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

# Final program identity selected locally; not yet deployed.
[programs.localnet]
pumplite = "Y7kugrkxDgMV8GxrkcY95LzCPMvmzcCfhYzhuCWrGd9"

# Required by the Anchor CLI parser for IDL generation. No wallet exists at this path.
